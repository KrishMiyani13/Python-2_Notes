<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
</head>
<body>
    <nav>
        {% if user.is_authenticated %}
            <h1>{{user.username}}</h1>
            <a href="{% url 'home' %}">home</a>
            <a href="">Logout</a>
        {% else %}
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'signup' %}">Signup</a>
        {% endif %}
    </nav>
    <hr>
    {% block content %}

    {% endblock %}
</body>
</html>
