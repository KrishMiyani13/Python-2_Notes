<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block extra_css %}
    {% endblock %}
</head>
<body>
    <nav>
        {% if user.is_authenticated %}
        <h4 class="name" style="color: rgb(207, 210, 234);">Welcome, {{ user.username }}!</h4>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'add_student' %}">Student</a>
        <a href="">Courses</a>
        <a href="{% url 'logout' %}">Logout</a>
        {% else %}
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'signup' %}">Signup</a>
        <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </nav>
    <hr>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
